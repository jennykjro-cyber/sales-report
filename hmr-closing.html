const PW_KEY='sms_shared_pw';
// The vendor manifest lives inside the encrypted payload as inert JSON, and the
// download handler lives out here. A <script> written through document.write()
// lands in the DOM without ever executing, so nothing the page needs at click
// time may live inside the decrypted HTML.
var FILES={};
// Kept in memory as well as sessionStorage: storage does not reliably survive the
// document.open() that render() performs, but window globals do.
var PW='';
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function keyFrom(pw,salt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(salt),iterations:100000,hash:'SHA-256'},km,{name:'AES-CBC',length:256},false,['decrypt']);
}
async function decryptWith(pw){
  const key=await keyFrom(pw,S);
  const dec=await crypto.subtle.decrypt({name:'AES-CBC',iv:b64(I)},key,b64(C));
  return new TextDecoder().decode(dec);
}
function render(html){
  document.open();document.write(html);document.close();
  const el=document.getElementById('files-data');
  if(el){try{FILES=JSON.parse(el.textContent);}catch(e){}}
}
async function tryDecrypt(){
  const pw=document.getElementById('pw').value;
  if(!pw)return;
  try{
    const html=await decryptWith(pw);
    PW=pw;
    try{sessionStorage.setItem(PW_KEY,pw);}catch(e){}
    render(html);
  }catch(e){
    document.getElementById('err').style.display='block';
    document.getElementById('pw').value='';
    document.getElementById('pw').focus();
  }
}
async function downloadVendor(code,btnEl){
  const pw=PW||sessionStorage.getItem(PW_KEY);
  if(!pw){alert('세션이 만료되었습니다. 새로고침 후 비밀번호를 다시 입력해주세요.');return;}
  const f=FILES[code];
  if(!f){alert('해당 거래처 파일을 찾을 수 없습니다.');return;}
  const orig=btnEl.textContent;
  btnEl.disabled=true;btnEl.textContent='...';
  try{
    const resp=await fetch(f.path+'?cb='+Date.now());
    if(!resp.ok){throw new Error('fetch failed: '+resp.status);}
    const cipherB64=(await resp.text()).trim();
    const key=await keyFrom(pw,f.salt);
    const buf=await crypto.subtle.decrypt({name:'AES-CBC',iv:b64(f.iv)},key,b64(cipherB64));
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=f.name;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
  }catch(e){
    // Each rebuild re-encrypts with fresh keys, so a page cached from before the
    // daily run cannot read the files now published. Reload past the cache once
    // and let the user retry rather than leaving them at a dead end.
    if(location.search.indexOf('reloaded=1')===-1){
      location.replace(location.pathname+'?reloaded=1&cb='+Date.now());
      return;
    }
    alert('다운로드에 실패했습니다: '+e.message);
  }finally{
    btnEl.disabled=false;btnEl.textContent=orig;
  }
}
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')tryDecrypt()});

(async function init(){
  const saved=sessionStorage.getItem(PW_KEY);
  if(saved){
    try{
      const html=await decryptWith(saved);
      PW=saved;
      render(html);
      return;
    }catch(e){ sessionStorage.removeItem(PW_KEY); }
  }
  document.getElementById('loginBox').style.display='block';
  document.getElementById('pw').focus();
})();
</script>
