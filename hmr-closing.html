  }catch(e){
    document.getElementById('err').style.display='block';
    document.getElementById('pw').value='';
    document.getElementById('pw').focus();
  }
}
async function downloadVendor(code,btnEl){
  const pw=PW||sessionStorage.getItem(PW_KEY);
  if(!pw){alert('세션이 만료되었습니다. 새로고침 후 비밀번호를 다시 입력해주세요.');return;}
  const f=FILES[code];
  if(!f){alert('해당 거래처 파일을 찾을 수 없습니다.');return;}
  const orig=btnEl.textContent;
  btnEl.disabled=true;btnEl.textContent='...';
  try{
    const resp=await fetch(f.path+'?cb='+Date.now());
    if(!resp.ok){throw new Error('fetch failed: '+resp.status);}
    const cipherB64=(await resp.text()).trim();
    const key=await keyFrom(pw,f.salt);
    const buf=await crypto.subtle.decrypt({name:'AES-CBC',iv:b64(f.iv)},key,b64(cipherB64));
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=f.name;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
  }catch(e){
    // Each rebuild re-encrypts with fresh keys, so a page cached from before the
    // daily run cannot read the files now published. Reload past the cache once
    // and let the user retry rather than leaving them at a dead end.
    if(location.search.indexOf('reloaded=1')===-1){
      location.replace(location.pathname+'?reloaded=1&cb='+Date.now());
      return;
    }
    alert('다운로드에 실패했습니다: '+e.message);
  }finally{
    btnEl.disabled=false;btnEl.textContent=orig;
  }
}
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')tryDecrypt()});

(async function init(){
  const saved=sessionStorage.getItem(PW_KEY);
  if(saved){
    try{
      const html=await decryptWith(saved);
      PW=saved;
      render(html);
      return;
    }catch(e){ sessionStorage.removeItem(PW_KEY); }
  }
  document.getElementById('loginBox').style.display='block';
  document.getElementById('pw').focus();
})();
