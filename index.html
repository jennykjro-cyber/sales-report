const PW_KEY='sms_shared_pw';
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function decryptWith(pw){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits','deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(S),iterations:100000,hash:'SHA-256'},km,{name:'AES-CBC',length:256},false,['decrypt']);
  const dec=await crypto.subtle.decrypt({name:'AES-CBC',iv:b64(I)},key,b64(C));
  return new TextDecoder().decode(dec);
}
function render(html){
  document.open();document.write(html);document.close();
  // A <script> written through document.write() can land in the DOM without ever
  // executing. Pages that need theirs to run mark it data-run-after-write; we
  // remove those and append fresh nodes, which does execute. Unmarked scripts are
  // left exactly as-is.
  document.querySelectorAll('script[data-run-after-write]').forEach(function(old){
    var code=old.textContent;
    old.parentNode.removeChild(old);
    var s=document.createElement('script');
    s.textContent=code;
    document.body.appendChild(s);
  });
}
async function tryDecrypt(){
  const pw=document.getElementById('pw').value;
  if(!pw)return;
  try{
    const html=await decryptWith(pw);
    sessionStorage.setItem(PW_KEY,pw);
    render(html);
  }catch(e){
    document.getElementById('err').style.display='block';
    document.getElementById('pw').value='';
    document.getElementById('pw').focus();
  }
}
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')tryDecrypt()});

      const html=await decryptWith(saved);
      render(html);
      return;
    }catch(e){ sessionStorage.removeItem(PW_KEY); }
  }
  document.getElementById('loginBox').style.display='block';
  document.getElementById('pw').focus();
})();
</script>
