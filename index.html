  document.querySelectorAll('script[data-run-after-write]').forEach(function(old){
    var code=old.textContent;
    old.parentNode.removeChild(old);
    var s=document.createElement('script');
    s.textContent=code;
    document.body.appendChild(s);
  });
}
async function tryDecrypt(){
  const pw=document.getElementById('pw').value;
  if(!pw)return;
  try{
    const html=await decryptWith(pw);
    sessionStorage.setItem(PW_KEY,pw);
    render(html);
  }catch(e){
    document.getElementById('err').style.display='block';
    document.getElementById('pw').value='';
    document.getElementById('pw').focus();
  }
}
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')tryDecrypt()});

(async function init(){
  const saved=sessionStorage.getItem(PW_KEY);
  if(saved){
    try{
      const html=await decryptWith(saved);
      render(html);
      return;
    }catch(e){ sessionStorage.removeItem(PW_KEY); }
  }
  document.getElementById('loginBox').style.display='block';
  document.getElementById('pw').focus();
})();
</script>
